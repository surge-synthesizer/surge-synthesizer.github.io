on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"
      - run: pnpm install
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  pdf:
    runs-on: ubuntu-latest
    needs: build
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.cache/puppeteer
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - uses: actions/cache@v4
        id: puppeteer
        with:
          path: "${{ github.workspace }}/.cache/puppeteer"
          key: "puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install Chrome OS dependencies
        run: npx puppeteer install-deps

      - run: |
          pnpm install
          pnpm puppeteer browsers install chrome

      - name: Build site static files first
        run: pnpm build

      - name: Start preview server
        run: |
          pnpm exec astro preview --host 127.0.0.1 --port 4321 &
          echo $! > dev_server.pid

      - name: Wait for server
        run: |
          echo "Waiting for server on http://127.0.0.1:4321/manual-xt/ ..."
          for i in {1..30}; do
            if curl --output /dev/null --silent --head --fail http://127.0.0.1:4321/manual-xt/; then
              echo "Server is up!"
              break
            fi
            echo "Waiting... ($i)"
            sleep 2
          done

      - name: Generate PDF
        run: pnpm pdf

      - if: always()
        run: |
          if [ -f dev_server.pid ]; then
            kill $(cat dev_server.pid) || true
            rm dev_server.pid
          fi

      - name: Publish PDF to GitHub Release
        run: |
          gh release delete surge-xt-manual -y || true
          gh release create surge-xt-manual dist/Surge-XT-Manual.pdf -t "Surge XT Manual" -n "PDF version of the Surge XT Manual"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4